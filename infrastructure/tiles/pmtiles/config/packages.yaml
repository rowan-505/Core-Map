# PMTiles package configuration (v1)
#
# A package key maps to one or more admin boundaries from local
# tile_source.admin_areas. Export unions those polygons, then applies the
# existing package-edge buffer (~10 km).
#
# v1: one package per Myanmar state/region (15 packages).
# Later: split oversized packages by listing district (or other) members, e.g.:
#
#   shan-north:
#     label: Shan North
#     members:
#       - { admin_level: district, name_en: "..." }
#
# Rules:
# - Do not use arbitrary grids.
# - Members match by exact admin_level + name_en / name_mm (and optional core_id).
# - Exact names only — never fuzzy-match extra state_region rows (e.g. Wa).

version: 1

packages:
  yangon:
    label: Yangon Region
    members:
      - admin_level: state_region
        name_en: Yangon Region
        name_mm: ရန်ကုန်တိုင်းဒေသကြီး

  bago:
    label: Bago Region
    members:
      - admin_level: state_region
        name_en: Bago Region
        name_mm: ပဲခူးတိုင်းဒေသကြီး
        osm_relation_id: 5996474

  ayeyarwady:
    label: Ayeyarwady Region
    members:
      - admin_level: state_region
        # Snapshot name_en blank; name_mm may include ZWSP — resolver strips ZWSP.
        name_mm: ဧရာဝတီတိုင်း
        osm_relation_id: 5996473

  mandalay:
