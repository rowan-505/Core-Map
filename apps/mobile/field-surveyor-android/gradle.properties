org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
kotlin.code.style=official
android.useAndroidX=true
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false

# AGP 9 runs a jlink-based JDK image transform. A full JDK (with jlink) is required.
# Do not point Gradle at the VS Code Red Hat Java embedded JRE — it has no jlink.
# Set org.gradle.java.home in ~/.gradle/gradle.properties or export JAVA_HOME to
# Homebrew OpenJDK 21 (see .vscode/settings.json). Do not commit machine-local paths here.
# Kept for older AGP tooling; AGP 9.1 may ignore this flag.
android.disableJdkImageTransform=true

# Non-secret Fastify origin only.
# Prefer USB tunnel for physical phones (see scripts/adb-reverse-api.sh). Do not commit a LAN IP.
# CLI: -PfieldApiBaseUrl=http://127.0.0.1:3001
# Debug runtime auto: phone → 127.0.0.1, emulator → 10.0.2.2, optional in-app override.
# Release default: https://api.coremapmm.com
# Do not put JWT secrets, R2 keys, or database URLs here.
