org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
kotlin.code.style=official
android.useAndroidX=true
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false

# Avoid the AGP jlink transform when a stale/incomplete JDK path is still cached.
# Prefer a full local JDK via JAVA_HOME / IDE settings — do not commit org.gradle.java.home.
android.disableJdkImageTransform=true

# Non-secret Fastify origin only.
# Prefer USB tunnel for physical phones (see scripts/adb-reverse-api.sh). Do not commit a LAN IP.
# CLI: -PfieldApiBaseUrl=http://127.0.0.1:3001
# Debug runtime auto: phone → 127.0.0.1, emulator → 10.0.2.2, optional in-app override.
# Release default: https://api.coremapmm.com
# Do not put JWT secrets, R2 keys, or database URLs here.
